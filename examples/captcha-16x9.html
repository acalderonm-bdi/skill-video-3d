  const blip = buf(0.12, t => (Math.sin(2 * Math.PI * (1560 + 300 * Math.min(1, t * 40)) * t) * 0.6 + Math.sin(2 * Math.PI * 3120 * t) * 0.12) * Math.min(1, t * 400) * Math.exp(-t * 38));

// ───────────────────────── measuring ─────────────────────────
function boxPts() { const pts = []; for (const x of [-BW / 2, BW / 2]) for (const y of [0.05, BH - 0.05]) for (const z of [-BD / 2, BD / 2]) pts.push(V(x * 0.92, y, z * 0.92)); return pts; }
function measure() {
  const out = { minBodyGlass: 1e9, minArmGlass: 1e9, worstBody: null, worstArm: null, camMaxDegPerFrame: 0, camWorst: null, taps: [] };
  const pts = boxPts(), O = V(0, 0, LID_Z); let prevQ = null;
  for (let f = 0; f <= NF; f++) {
    const t = f / FPS; setState(t); clawd.updateMatrixWorld(true);
    for (const p of pts) { const w = body.localToWorld(p.clone().sub(V(0, BH / 2, 0))); const d = w.clone().sub(O).dot(SN); if (d < out.minBodyGlass) { out.minBodyGlass = d; out.worstBody = f; } }
    for (const a of [armN, armF]) { const m = a.children[0]; for (const s of [0, 0.25, 0.5, 0.75, 1]) { const w = m.localToWorld(V(-0.1 + s * (L_ARM + 0.1), 0, 0)); const d = w.clone().sub(O).dot(SN) - R_NUB; if (d < out.minArmGlass) { out.minArmGlass = d; out.worstArm = [f, a === armN ? 'near' : 'far', s]; } } }

function camRates() { const r = []; let prev = null; for (let f = 0; f <= NF; f++) { setState(f / FPS); const q = camera.quaternion.clone(); if (prev) r.push(+(2 * Math.acos(clamp(Math.abs(prev.dot(q)), -1, 1)) / DEG).toFixed(3)); prev = q; } return r; }

// ───────────────────────── API ─────────────────────────
window.renderAt = (t) => { renderComposite(wrap(t), SUB, Math.round(t * FPS)); };
