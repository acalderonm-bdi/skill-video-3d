  const blip = (f) => buf(0.16, t => (sin(f, t) * 0.6 + sin(f * 2, t) * 0.15) * Math.min(1, t * 400) * Math.exp(-t * 26));
  const tickS = buf(0.05, t => sin(3200, t) * Math.exp(-t * 120) * 0.4);
  const fail = buf(0.6, t => (sin(t < 0.22 ? 330 : 247, t) * 0.5 + sin(t < 0.22 ? 165 : 123, t) * 0.3) * Math.min(1, t * 300) * Math.exp(-((t % 0.3)) * 6) * 0.6);

// ───────────────────────── measuring ─────────────────────────
function measure() {
  const out = { minBodyGlass: 1e9, minArmGlass: 1e9, worstArm: null, camMaxDegPerFrame: 0, camWorst: null, taps: [] };
  const pts = []; for (const x of [-BW / 2, BW / 2]) for (const y of [0.05, BH - 0.05]) for (const z of [-BD / 2, BD / 2]) pts.push(V(x * 0.92, y, z * 0.92));
  const O = V(0, 0, LID_Z); let prevQ = null;
  for (let f = 0; f <= NF; f++) {
    const t = f / FPS; setState(t); clawd.updateMatrixWorld(true);
    for (const p of pts) { const w = body.localToWorld(p.clone().sub(V(0, BH / 2, 0))); const d = w.clone().sub(O).dot(SN); if (d < out.minBodyGlass) out.minBodyGlass = d; }
    for (const a of [armN, armF]) { const m = a.children[0]; for (const s of [0, 0.5, 1]) { const w = m.localToWorld(V(-0.1 + s * (L_ARM + 0.1), 0, 0)); const d = w.clone().sub(O).dot(SN) - R_NUB; if (d < out.minArmGlass) { out.minArmGlass = d; out.worstArm = [f, a === armN ? 'near' : 'far']; } } }
    const q = camera.quaternion.clone(); if (prevQ) { const a = 2 * Math.acos(clamp(Math.abs(prevQ.dot(q)), -1, 1)) / DEG; if (a > out.camMaxDegPerFrame) { out.camMaxDegPerFrame = a; out.camWorst = f; } } prevQ = q;
  }

  return out;
}
