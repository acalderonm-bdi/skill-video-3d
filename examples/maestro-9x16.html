// ───────────────────────── sound: lo-fi bed + SFX from the same timeline (narration is mixed in ffmpeg, with ducking) ─────────────────────────
async function renderAudio() {

  const verbG = ctx.createGain(); verbG.gain.value = 0.25; verb.connect(verbG); verbG.connect(master);

  const bass = (f) => buf(1.2, t => Math.tanh(1.6 * (sin(f, t) + 0.2 * sin(2 * f, t))) * Math.exp(-t * 2.2) * Math.min(1, t * 200) * 0.5);

  const alert = buf(0.7, t => (sin(Math.floor(t / 0.17) % 2 ? 660 : 880, t)) * (t % 0.17 < 0.13 ? 1 : 0) * 0.32 * Math.min(1, (t % 0.17) * 400));

  const land = buf(0.08, t => (noise() * 0.4 + sin(260, t) * 0.5) * Math.exp(-t * 80));

  const panAt = (t, pnt) => { setState(t); const v = pnt.clone().project(camera); return clamp(v.x * 0.7, -0.8, 0.8); };
  for (const [ts] of SW) { play(whooshUp, ts - 0.04 + F, 0.22, 0, 0.2); play(pop, ts + F, 0.22, 0, 0.2); play(bonk, ts + 0.3 + F, 0.24, 0, 0.15); }

  TAPS.slice(2, 6).forEach((tp, i) => play(blip([784, 880, 988, 1175][i]), tp.t + 0.05 + F, 0.35, panAt(tp.t, tp.T), 0.3));

  // landings on the deck (non-key hops)
  [10.44, 10.54, 10.64, 21.5, 22.0, 28.74, 28.8, 28.86].forEach(tl => play(land, tl + F, 0.25, 0, 0.1));
  TESTS1.concat(TESTS2).forEach(([tl, mk]) => { if (mk === '✓') play(tickS, tl + F, 0.5, 0.2, 0.1); });
  play(fail, E.fail + F, 0.5, 0.2, 0.25);
  play(arp([72, 76, 79, 84], 0.07), E.green + F, 0.55, 0, 0.35);
  play(hum, 22.25, 0.6, 0.3, 0.2);
  SEC.forEach(([ts], i) => { if (i !== 3) play(tickS, ts + F, 0.45, 0.3, 0.1); });
  play(alert, E.alert + F, 0.42, 0.35, 0.25);
  play(clack, E.lock + F, 0.6, 0.3, 0.15); play(shimmer, E.shield + F, 0.45, 0.3, 0.4);
  play(riser, E.deployGo + F, 0.45, 0.2, 0.3);
  [27.3, 27.6, 27.9, 28.2].forEach(ts => play(tickS, ts + F, 0.45, 0.25, 0.1));
  play(arp([67, 72, 76, 79, 84], 0.06, 1.2), E.live + F, 0.6, 0, 0.4); play(crash, E.live + F, 0.45, 0, 0.3);

  { let w4 = 0; const swish = buf(0.3, t => { w4 += (0.15 + 0.5 * Math.sin(Math.PI * t / 0.3)) * (noise() - w4); return w4 * Math.sin(Math.PI * t / 0.3) ** 2 * 0.9; }); PH.forEach(p0 => play(swish, p0 + 0.3, 0.35, -0.3, 0.15)); }

}

// ───────────────────────── measuring ─────────────────────────
function measure() {
  const out = { minBodyGlass: 1e9, minArmGlass: 1e9, worstArm: null, camMaxDegPerFrame: 0, camWorst: null, taps: [] };
  const pts = []; for (const x of [-BW / 2, BW / 2]) for (const y of [0.05, BH - 0.05]) for (const z of [-BD / 2, BD / 2]) pts.push(V(x * 0.92, y, z * 0.92));
  const O = V(0, 0, LID_Z); let prevQ = null;
  for (let f = 0; f <= NF; f++) {
    const t = f / FPS; setState(t);
    for (const c of WK) { c.root.updateMatrixWorld(true);
    for (const p of pts) { const w = c.body.localToWorld(p.clone().sub(V(0, BH / 2, 0))); const d = w.clone().sub(O).dot(SN); if (d < out.minBodyGlass) out.minBodyGlass = d; }
    for (const a of [c.armN, c.armF]) { const m = a.children[0]; for (const s of [0, 0.5, 1]) { const w = m.localToWorld(V(-0.1 + s * (L_ARM + 0.1), 0, 0)); const d = w.clone().sub(O).dot(SN) - R_NUB; if (d < out.minArmGlass) { out.minArmGlass = d; out.worstArm = [f, c.name]; } } } }
    const q = camera.quaternion.clone(); if (prevQ) { const a = 2 * Math.acos(clamp(Math.abs(prevQ.dot(q)), -1, 1)) / DEG; if (a > out.camMaxDegPerFrame) { out.camMaxDegPerFrame = a; out.camWorst = f; } } prevQ = q;
  }
  for (const c of WK) for (const tp of c.taps) { setState(tp.t); c.root.updateMatrixWorld(true); const tip = c.armN.children[0].localToWorld(V(L_ARM, 0, 0)); out.taps.push({ who: c.name, t: tp.t, err_cm: +tip.distanceTo(tp.sol.C).toFixed(4) }); }
  return out;
}
// ───────────────────────── API ─────────────────────────
window.renderAt = (t) => { renderComposite(wrap(t), SUB, Math.round(t * FPS)); };
window.renderFrame = (f) => { renderComposite(f / FPS, SUB, f); return renderer.domElement.toDataURL('image/png'); };
window.renderAudio = renderAudio; window.measure = measure;
window.INFO = { home: HOME.map(h => h.toArray().map(x => +x.toFixed(2))), keyhits: KEYHITS.length, typing: TYPE.length };
window.READY = true;
if (TFIX != null) renderComposite(wrap(TFIX), SUB, Math.round(TFIX * FPS));
else if (!RENDER) { const t0 = performance.now(); const loop = () => { renderComposite(((performance.now() - t0) / 1000) % DUR, 1); requestAnimationFrame(loop); }; loop(); }
